services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata  # Явно указываем поддиректорию
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - slaver
    command: >
      sh -c "
        if [ -d /var/lib/postgresql/data/pgdata ]; then
          echo 'Using existing data directory';
          exec docker-entrypoint.sh postgres;
        else
          echo 'Initializing new database';
          mkdir -p /var/lib/postgresql/data/pgdata;
          chown -R postgres:postgres /var/lib/postgresql/data;
          exec docker-entrypoint.sh postgres;
        fi
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    

  # --- Backend Application ---
  backend:
    container_name: slaver-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Для Prisma (если schema.prisma использует POSTGRES_URL)
      POSTGRES_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}?schema=public"
      # Для приложения (если использует DATABASE_URL)
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}?schema=public"
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - slaver
    command: sh -c "npx prisma migrate deploy && npm run start:prod"


volumes:
  postgres_data:

networks:
  slaver:
    driver: bridge